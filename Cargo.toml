[workspace]
members = ["crates/protocol", "crates/client", "crates/cli", "crates/desktop"]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
btleplug = "0.12"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "io-util", "net"] }
uuid = "1"

